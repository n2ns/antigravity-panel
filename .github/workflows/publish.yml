name: Publish Extension

on:
  push:
    tags:
      - 'v*'  # Trigger: pushing a v* tag (e.g. v0.2.1)
  workflow_dispatch:  # Allow manual runs

jobs:
  # Build and test
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run production typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run server integration tests
        run: npm run test:server

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 7

  # Publish to VS Code Marketplace
  publish-marketplace:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: build
    # A failure here must not block the other publishing jobs
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reuse the tested artifact from the build job so all three channels publish the same bytes
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix-package

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # Publish to Open VSX Registry
  publish-openvsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: build
    # A failure here must not block the other publishing jobs
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reuse the tested artifact from the build job so all three channels publish the same bytes
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix-package

      - name: Publish to Open VSX
        run: npx ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # A failure here must not block the other publishing jobs
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix-package

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
